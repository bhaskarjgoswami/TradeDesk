services:
  - type: web
    name: tradedesk-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Set the rest in the Render dashboard (Environment tab) — secrets:
      #   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
      #   SUPABASE_JWT_SECRET, DATABASE_URL, FRONTEND_URL,
      #   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET,
      #   EXCHANGE_ENC_KEY (Fernet key for exchange API secrets),
      #   SENTRY_DSN (optional error tracking)

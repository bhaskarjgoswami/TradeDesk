<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TradeDesk · Onboarding preview</title><script src="/language.js"></script><link rel="stylesheet" href="/workspace.css"><link rel="stylesheet" href="/theme-mercury.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f4f3fa;color:#28253b;font-family:Inter,system-ui,sans-serif}.preview-backdrop{padding:40px;max-width:1100px;margin:auto}.preview-backdrop h1{font-size:30px;font-weight:500}.preview-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.preview-grid span{height:100px;border-radius:14px;background:#e9e6f5}.preview-label{font-size:12px;color:#776d82}.btn{border:0;border-radius:30px;cursor:pointer;font:inherit}.preview-backdrop button{padding:12px 24px;background:#605cf1;color:#fff}.preview-backdrop p{line-height:1.8}</style></head><body><main class="preview-backdrop"><p class="preview-label">Interactive design preview · no profile data is sent</p><h1>TradeDesk</h1><div class="preview-grid" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><p id="previewStatus" role="status">Explore the new welcome cards. Preview answers stay in this page only.</p><button id="previewAgain">Open preview</button></main><script>

const pfCountries=()=>{const names=new Intl.DisplayNames([TDLocale.language],{type:'region'});return codes.map(code=>[code,names.of(code)]).sort((a,b)=>a[1].localeCompare(b[1],TDLocale.language));};
